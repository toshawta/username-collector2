<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>user name</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#020d0f;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;font-family:'Orbitron',monospace;overflow:hidden;position:relative;}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .content{position:relative;z-index:1;padding:60px 80px;width:100%;}
  .title{font-size:clamp(40px,6vw,80px);font-weight:900;color:#00e5ff;letter-spacing:0.25em;text-transform:lowercase;margin-bottom:8px;text-shadow:0 0 30px rgba(0,229,255,0.4);}
  .divider{width:100%;height:2px;background:linear-gradient(90deg,#00e5ff,transparent);margin-bottom:48px;box-shadow:0 0 10px #00e5ff88;}
  .form-wrap{max-width:560px;margin:0 auto 0 auto;}
  .label{font-size:11px;letter-spacing:0.2em;color:#00e5ff;margin-bottom:12px;display:block;}
  .input-box{width:100%;background:rgba(0,20,25,0.85);border:1.5px solid #00e5ff66;border-radius:4px;padding:20px;font-size:13px;color:#aaeeff;font-family:'Orbitron',monospace;letter-spacing:0.05em;outline:none;transition:border-color 0.2s,box-shadow 0.2s;resize:none;height:90px;}
  .input-box::placeholder{color:#2a7080;}
  .input-box:focus{border-color:#00e5ff;box-shadow:0 0 0 2px #00e5ff33,inset 0 0 20px rgba(0,229,255,0.05);}
  .btn{width:100%;margin-top:16px;padding:18px;background:#00e5ff;border:none;border-radius:4px;font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:0.25em;color:#000d10;cursor:pointer;transition:background 0.15s,box-shadow 0.15s;text-transform:uppercase;}
  .btn:hover{background:#33edff;box-shadow:0 0 24px #00e5ff88;}
  .btn:active{background:#00c4d9;}
  .btn:disabled{background:#006070;color:#003040;cursor:not-allowed;box-shadow:none;}
  .msg{margin-top:14px;font-size:11px;letter-spacing:0.1em;text-align:center;min-height:18px;}
  .msg.ok{color:#00ff88;}
  .msg.err{color:#ff4466;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <h1 class="title">u s e r &nbsp; n a m e</h1>
  <div class="divider"></div>
  <div class="form-wrap">
    <span class="label">ROBLOX USER NAME</span>
    <textarea class="input-box" id="username" placeholder="paste your roblox username here for me to add you on roblox..."></textarea>
    <button class="btn" id="sendBtn" onclick="sendIt()">SEND</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
const WEBHOOK = "https://discord.com/api/webhooks/1501211310195605586/M54GBIkVE_zHXxt4G2ybTf9bLBGex_FAd2v2rfJt4ZrsFAqJ7a6SxIz2OhXloNOPF9-T";

async function sendIt() {
  const u = document.getElementById('username').value.trim();
  const btn = document.getElementById('sendBtn');
  const msg = document.getElementById('msg');
  if (!u) { msg.className='msg err'; msg.textContent='please enter your username'; return; }
  btn.disabled = true; btn.textContent = 'SENDING...';
  msg.className = 'msg'; msg.textContent = '';

  const body = JSON.stringify({ content: `🎮 **New Roblox Username**\n\`\`\`${u}\`\`\`` });

  // Attempt 1: direct
  try {
    const r = await fetch(WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body });
    if (r.ok || r.status === 204) { return done(true); }
  } catch(e) {}

  // Attempt 2: corsproxy.io
  try {
    const r = await fetch("https://corsproxy.io/?" + encodeURIComponent(WEBHOOK), { method:'POST', headers:{'Content-Type':'application/json'}, body });
    if (r.ok || r.status === 204) { return done(true); }
  } catch(e) {}

  // Attempt 3: cors.sh (no key needed for basic use)
  try {
    const r = await fetch(WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json','x-cors-api-key':'temp_'}, body });
    if (r.ok || r.status === 204) { return done(true); }
  } catch(e) {}

  done(false);

  function done(ok) {
    if (ok) {
      msg.className = 'msg ok';
      msg.textContent = 'sent! i will add you soon ✓';
      document.getElementById('username').value = '';
    } else {
      msg.className = 'msg err';
      msg.textContent = 'failed to send, try again';
    }
    btn.disabled = false; btn.textContent = 'SEND';
  }
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let pts = [];
function resize() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
for (let i = 0; i < 80; i++) pts.push({x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight, vx:(Math.random()-.5)*0.3, vy:(Math.random()-.5)*0.3, r:Math.random()*1.5+0.5});
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  pts.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>cv.width)p.vx*=-1; if(p.y<0||p.y>cv.height)p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='#00e5ff'; ctx.fill(); });
  for (let i = 0; i < pts.length; i++) for (let j = i+1; j < pts.length; j++) {
    const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.sqrt(dx*dx+dy*dy);
    if (d < 140) { ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y);
      ctx.strokeStyle=`rgba(0,229,255,${0.15*(1-d/140)})`; ctx.lineWidth=0.5; ctx.stroke(); }
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
